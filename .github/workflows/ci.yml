
name: CI Proyecto

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Construir contenedores
        run: docker compose build

      - name: Iniciar servicios
        run: docker compose up -d

      - name: Verificar Flask y MySQL
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/api/salud \
              | grep -q '"mysql":"conectado"'; then
              echo "Flask y MySQL conectados"
              exit 0
            fi

            echo "Esperando servicios: intento $i"
            sleep 2
          done

          docker compose logs
          exit 1

      - name: Verificar dashboard
        run: |
          curl -fsS http://localhost:5000/salud \
            -o dashboard.html

          grep -q "Monitor de servicios" dashboard.html
          echo "Dashboard funcionando"

      - name: Verificar usuarios
        run: |
          curl -fsS http://localhost:5000/usuarios \
            -o usuarios.json

          python3 -c 'import json; d=json.load(open("usuarios.json")); assert isinstance(d,list) and len(d)>=2, "No se encontraron los usuarios esperados"'

          echo "Consulta de usuarios correcta"

      - name: Validar integridad de usuarios MySQL
        run: python3 tests/test_usuarios.py


      - name: Apagar contenedores
        if: always()
        run: docker compose down
